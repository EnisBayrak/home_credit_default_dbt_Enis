# =============================================================================
# dbt_project.yml -- the project's identity card
# Renamed from the scaffold's 'my_new_project' to the real project name.
# NOTE: the 'models:' block below MUST use this same name as its top key,
# otherwise the folder-level materialization settings silently do nothing.
# =============================================================================
name: 'home_credit_dbt'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  home_credit_dbt:
    # Layer-level materialization defaults. Individual models can still
    # override with {{ config(...) }} -- and ours do, deliberately:
    # staging = view (thin, cheap), intermediate/marts = table (expensive
    # aggregations written down once instead of re-billed on every query).
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
